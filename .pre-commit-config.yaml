repos:
  # General File Formatting & Git Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files

  # Sensitive Credentials (Lightning Fast)
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (detect credentials)
        entry: gitleaks protect -v --staged
        language: system
        pass_filenames: false

  # Python Code Smells (Replaces flake8/black - Runs in milliseconds)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [ --fix ]

  # JavaScript/TypeScript Code Smells
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        additional_dependencies:
          - eslint@8.56.0
          - eslint-config-prettier@9.1.0

  # Terraform Code Smells & Formatting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint

  # Java Code Smells (Uses locally installed checkstyle)
  - repo: local
    hooks:
      - id: checkstyle
        name: checkstyle (Java code style)
        entry: bash -c 'output=$(checkstyle -c /google_checks.xml "$@" 2>&1); echo "$output"; echo "$output" | grep -q "\[WARN\]" && exit 1 || exit 0' --
        language: system
        files: \.java$
